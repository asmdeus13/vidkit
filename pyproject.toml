[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vidkit"
version = "0.1.0"
description = "Five QA checkpoints for an AI video pipeline: check / pick / plint / voice / color"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
    "soundfile>=0.11",
]

[project.scripts]
vidkit = "vidkit.cli:main"

[tool.setuptools]
packages = ["vidkit"]
